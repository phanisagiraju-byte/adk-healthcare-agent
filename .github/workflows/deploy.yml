name: CI/CD - Test & Deploy to Google Cloud (WIF + gcloud + Terraform)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Required for Workload Identity Federation (OIDC token exchange)
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'agenticsetup-510220' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || 'global' }}
  SERVICE_NAME: adk-healthcare-agent
  AR_REPO: adk-healthcare-repo

jobs:
  test-and-validate:
    name: Unit Tests & IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Unit Tests & Golden Dataset Evaluations
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ env.VERTEX_LOCATION }}
        run: |
          python -m unittest discover -s tests -v
          python eval_suite.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validate Terraform IaC Scripts
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  deploy-to-gcp:
    name: Provision GCP Resources & Deploy Cloud Run via WIF
    needs: test-and-validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK (gcloud CLI)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable Required Google Cloud APIs via gcloud
        run: |
          gcloud services enable \
            aiplatform.googleapis.com \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            firestore.googleapis.com \
            logging.googleapis.com \
            cloudtrace.googleapis.com \
            --project="${PROJECT_ID}"

      - name: Provision Firestore Native Database (if not exists)
        run: |
          if ! gcloud firestore databases describe --database="(default)" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud firestore databases create \
              --database="(default)" \
              --location="${REGION}" \
              --type=firestore-native \
              --project="${PROJECT_ID}"
          else
            echo "Firestore (default) database already exists."
          fi

      - name: Provision Artifact Registry Repository (if not exists)
        run: |
          if ! gcloud artifacts repositories describe "${AR_REPO}" \
            --location="${REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${AR_REPO}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="Docker repository for ADK Healthcare Scheduling Agent" \
              --project="${PROJECT_ID}"
          else
            echo "Artifact Registry repository ${AR_REPO} already exists."
          fi

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          LATEST_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}:latest"
          docker build -t "${IMAGE_URI}" -t "${LATEST_URI}" .
          docker push "${IMAGE_URI}"
          docker push "${LATEST_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Deploy ADK Healthcare Agent to Cloud Run via gcloud
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE_URI}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account="${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --set-env-vars="GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${VERTEX_LOCATION}" \
            --memory="1Gi" \
            --cpu="1" \
            --min-instances=0 \
            --max-instances=5 \
            --port=8080 \
            --allow-unauthenticated \
            --quiet

      - name: Verify Deployed Cloud Run Health Endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(status.url)")
          echo "Deployed Cloud Run URL: ${SERVICE_URL}"
          curl --fail --retry 5 --retry-delay 3 "${SERVICE_URL}/health"
